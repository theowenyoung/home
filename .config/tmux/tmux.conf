# vim style tmux config
# change test
# use C-a, since it's on the home row and easier to hit than C-b
set-option -g prefix "M-d"
set -g history-limit 500
set -g base-index 1
set -g allow-passthrough on

# Clipboard: let OSC 52 from apps (nvim) reach the LOCAL terminal's clipboard.
# tmux 3.3 defaults set-clipboard to `external`, which *drops* OSC 52 sent by
# applications inside tmux -- nvim's copy would silently go nowhere. `on` makes
# tmux accept it and forward it out to the attached client's terminal.
set -g set-clipboard on
# Assert the outer terminal understands OSC 52, in case its terminfo lacks `Ms`.
set -as terminal-features ',*:clipboard'
# mosh 只接受带 `c;` 选择符的 OSC 52，收到空 selection（`\033]52;;...`）就丢弃。
# 两处都会踩到，所以这条 override 在 3.7 上依然必需：
#   1. 写：tmux < 3.4 转发应用的 OSC 52 时会抹掉该字段（tmux#3423）。3.7 已修。
#   2. 读：tmux 自己发起剪贴板查询时是 `tty_putcode_ss(tty, TTYC_MS, "", "?")`,
#      p1 硬传空串 -> `\033]52;;?`。这条至今如此，只能靠 override 强制成 `c`。
set -ag terminal-overrides ",*:Ms=\\E]52;c;%p2%s\\7"

# 反方向：应用（nvim）发 OSC 52 读查询时，让 tmux 去问终端要本机剪贴板，
# 再把答案转给发起查询的 pane。默认值 `buffer` 只会用 tmux 自己的 buffer
# 自问自答，拿不到 mac 上的内容。需要 tmux >= 3.7。
set -g get-clipboard request
# https://gpanders.com/blog/the-definitive-guide-to-using-tmux-256color-on-macos/
set -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ",${TERM}:Tc"
# Easy config reload
bind-key R source-file ~/.tmux.conf \; display-message "tmux.conf reloaded."

# auto rename window to current dir
set-option -g status-interval 5
set-option -g automatic-rename on
set-option -g automatic-rename-format '#{b:pane_current_path}'
# vi is good
setw -g mode-keys vi

# mouse behavior
setw -g mouse on

set-option -g focus-events on
#set-option -sa terminal-overrides ',xterm-256color:RGB'
# use vim-like keys for splits and windows
bind-key v split-window -h -c '#{pane_current_path}' -p 80
bind-key enter resize-pane -x 80%
bind-key s split-window -v -c '#{pane_current_path}' -l 20


bind-key c new-window
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

bind-key o display-popup -E -d '#{pane_current_path}' 'tmux-fzf'
bind-key g display-popup -E -d '#{pane_current_path}' echo rg -F
bind-key P display-popup -d '#{pane_current_path}'
# smart pane switching with awareness of vim splits
bind-key X  kill-session
bind-key D kill-window
bind-key w kill-pane

set-window-option -g display-panes-time 1500
set-window-option -g window-status-current-style fg=magenta
set-window-option -g xterm-keys on




# Status Bar
set-option -g status-interval 1
set-option -g status-style bg=black
set-option -g status-style fg=white
set -g status-left '#[fg=green]#H #[default]'
set -g status-right ' #{?client_prefix,#[reverse]<Pre>#[noreverse] ,}%H:%M %Y-%m-%d'
set-option -g pane-active-border-style fg=yellow
set-option -g pane-border-style fg=cyan

# copy and paste
bind Space copy-mode
bind -n C-M-Space copy-mode
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"

# Allow the arrow key to be used immediately after changing windows
set-option -g repeat-time 0
set -sg escape-time 1



# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"
bind-key -n 'C-Space' if-shell "$is_vim" 'send-keys C-Space' 'select-pane -t:.+'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l
bind-key -T copy-mode-vi 'C-Space' select-pane -t:.+
